name: Stock Pi migration regressions

on:
  pull_request:
    paths:
      - '.github/workflows/pi-runtime-ci.yml'
      - 'harness/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [rubato/base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-pi:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - name: Dependency-free migration regressions
        run: node --test harness/pi-runtime/test/migration-regressions.test.mjs
      - name: Install the isolated stock dependency tree
        run: npm --prefix harness/pi-runtime ci --workspaces=false --ignore-scripts
      - name: Compose role prompts and skills into the standard install location
        run: |
          bash harness/prompts/build.sh
          mkdir -p "$HOME/.agents"
          ln -sfn "$GITHUB_WORKSPACE/harness/prompts" "$HOME/.agents/rubato"
          ln -sfn "$GITHUB_WORKSPACE/harness/skills" "$HOME/.agents/skills"
      - name: Staged SDK, CLI, child runtime, install and rollback tests
        # These exercise real child processes, PTYs and stdio servers. Four at a
        # time contend for a shared runner and fail a different one each run, so
        # the hosted job trades wall time for a deterministic result.
        run: env -u NODE_OPTIONS -u NODE_COMPILE_CACHE npm --prefix harness/pi-runtime run test:ci --workspaces=false
