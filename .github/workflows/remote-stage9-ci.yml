name: Rubato Remote Stage 9

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'third_party/**'
      - 'THIRD-PARTY-NOTICES.md'
      - 'packages/rubato-remote-hub/**'
      - 'packages/rubato-remote-web/**'
      - 'packages/rubato-live-cli/**'
      - 'bun.lock'
  push:
    branches: [rubato/base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-license-release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - name: Frozen dependency installs
        run: |
          bun install --frozen-lockfile
          npm --prefix packages/rubato-remote-hub ci --dry-run --ignore-scripts
      - name: Canonical production vulnerability and license policy
        run: |
          bun audit --production
          node scripts/license-policy.mjs
      - name: Required executables stay executable
        run: |
          node scripts/check-executables.mjs
          node --test scripts/check-executables.test.mjs
      - name: Notice policy and tests
        run: |
          node scripts/check-third-party-notices.mjs
          node --test scripts/check-third-party-notices.test.mjs scripts/license-policy.test.mjs scripts/check-executables.test.mjs
      - name: Release and selective-uninstall security tests
        run: node --test scripts/remote-release/release-security.test.mjs
      - name: Hub, web, and terminal adversarial boundary tests
        run: |
          bun test packages/rubato-remote-hub/test/security-release.test.ts packages/rubato-remote-hub/test/path-security.test.ts packages/rubato-remote-hub/test/tickets-pairing.test.ts
          bun test scripts/security-web-boundaries.test.ts
          bun test packages/rubato-terminal-bridge/test
      - name: Short measured host qualification with explicit device-pending result
        run: node scripts/remote-release/qualification.mjs --profile ci --allow-device-pending --output .qualification/ci.json
      - name: Existing build and transform checks
        run: bash scripts/ci-local.sh
      - name: Remote production builds
        run: |
          npm --prefix packages/rubato-remote-hub run build
          npm --prefix packages/rubato-remote-web run build
          npm --prefix packages/rubato-live-cli run check
