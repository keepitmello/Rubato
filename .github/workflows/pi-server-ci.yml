name: Pi server integration

on:
  push:
    branches: [codex/pi-server-t3-integration-20260913]
    paths: ['harness/pi-server/**', 'harness/t3-integration/**', '.github/workflows/pi-server-ci.yml']
  pull_request:
    paths: ['harness/pi-server/**', 'harness/t3-integration/**', '.github/workflows/pi-server-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the isolated server dependencies
        run: npm --prefix harness/pi-server install --ignore-scripts --workspaces=false
      - name: Test published upstream compatibility
        run: npm --prefix harness/pi-server test --workspaces=false
      - name: Capture reproducible public-source validation bundle
        run: |
          mkdir -p "$RUNNER_TEMP/rubato-validation"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/rubato-validation/rubato-source.tar.gz"
          tar -czf "$RUNNER_TEMP/rubato-validation/pi-server-deps.tar.gz" -C harness/pi-server node_modules package-lock.json
          cp "$(command -v node)" "$RUNNER_TEMP/rubato-validation/node"
          git rev-parse HEAD > "$RUNNER_TEMP/rubato-validation/REVISION"
          npm install --prefix "$RUNNER_TEMP/pi-sdk" --ignore-scripts --no-audit @earendil-works/pi-coding-agent@0.85.1
          tar -czf "$RUNNER_TEMP/rubato-validation/pi-sdk-deps.tar.gz" -C "$RUNNER_TEMP/pi-sdk" node_modules package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rubato-validation-bundle
          path: ${{ runner.temp }}/rubato-validation/
          retention-days: 1
