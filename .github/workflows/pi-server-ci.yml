name: Pi server integration

on:
  push:
    branches: [codex/pi-server-t3-integration-20260913]
    paths: ['harness/pi-server/**', '.github/workflows/pi-server-ci.yml']
  pull_request:
    paths: ['harness/pi-server/**', '.github/workflows/pi-server-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the isolated server dependencies
        run: npm --prefix harness/pi-server install --ignore-scripts --workspaces=false
      - name: Test published upstream compatibility
        run: npm --prefix harness/pi-server test --workspaces=false
      - name: Capture the pinned public T3 source
        run: curl --fail --location --retry 2 https://codeload.github.com/pingdotgg/t3code/tar.gz/18d8cbfd920d0a53e5b5206456585aea767e852c --output "$RUNNER_TEMP/t3-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t3-pinned-source
          path: ${{ runner.temp }}/t3-source.tar.gz
          retention-days: 1
