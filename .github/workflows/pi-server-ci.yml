name: Pi server integration

on:
  push:
    branches: [codex/pi-server-t3-integration-20260913]
    paths: ['harness/pi-server/**', 'harness/t3-integration/**', '.github/workflows/pi-server-ci.yml']
  pull_request:
    paths: ['harness/pi-server/**', 'harness/t3-integration/**', '.github/workflows/pi-server-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the isolated server dependencies
        run: npm --prefix harness/pi-server install --ignore-scripts --workspaces=false
      - name: Test published upstream compatibility
        run: npm --prefix harness/pi-server test --workspaces=false
      - name: Capture exact T3 contract dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/t3-deps" --ignore-scripts --no-audit effect@4.0.0-rc.112 typescript@7.0.2 @types/node@24.12.4
          tar -czf "$RUNNER_TEMP/t3-contract-deps.tar.gz" -C "$RUNNER_TEMP/t3-deps" node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t3-contract-deps
          path: ${{ runner.temp }}/t3-contract-deps.tar.gz
          retention-days: 1
