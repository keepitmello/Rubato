<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubato call</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; }
  main { width: min(420px, 92vw); display: grid; gap: 16px; }
  .who { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .who button { border: 1px solid #8884; background: transparent; border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
  .who button[aria-pressed="true"] { background: #2b2b2b; color: white; }
  .who button:disabled { opacity: .4; cursor: not-allowed; }
  .voices { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .voices button { border: 1px solid #8884; background: transparent; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .voices button[aria-pressed="true"] { background: #1fb855; color: white; border-color: #1fb855; }
  .voices button:disabled { opacity: .4; cursor: not-allowed; }
  .ring { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 12px; border-radius: 14px; background: #1fb85522; }
  .ring[hidden] { display: none; }
  .ring button { border: 0; border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; color: white; }
  .ring #accept { background: #1fb855; } .ring #decline { background: #e5484d; }
  .state { text-align: center; font-size: 15px; opacity: .7; min-height: 1.4em; }
  .call { justify-self: center; width: 72px; height: 72px; border-radius: 50%; border: 0; font-size: 28px; cursor: pointer; background: #1fb855; color: white; }
  .call.live { background: #e5484d; }
  .log { display: grid; gap: 8px; max-height: 50vh; overflow: auto; }
  .bubble { padding: 9px 13px; border-radius: 18px; max-width: 82%; line-height: 1.4; font-size: 15px; }
  .me { justify-self: end; background: #1fb855; color: white; }
  .them { justify-self: start; background: #8882; }
  .why { text-align: center; font-size: 13px; color: #e5484d; }
</style>
</head>
<body>
<main>
  <div class="who" id="who"></div>
  <div class="ring" id="ring" hidden><b id="ringWho"></b><button id="accept">받기</button><button id="decline">거절</button></div>
  <div class="voices" id="voices"></div>
  <div class="state" id="state">누구랑 통화할지 골라줘</div>
  <button class="call" id="call" aria-label="통화">📞</button>
  <div class="why" id="why"></div>
  <div class="log" id="log"></div>
</main>
<script type="module">
import { Room, RoomEvent, Track } from '/livekit-client.mjs';
const $ = id => document.getElementById(id);
let chosen = null, room = null, voice = null;
function showVoices(item) {
  $('voices').replaceChildren();
  voice = item.voices.find(choice => choice.ready)?.id ?? null;
  for (const choice of item.voices) {
    const button = document.createElement('button');
    button.textContent = choice.label; button.disabled = !choice.ready; button.title = choice.reason ?? '';
    button.setAttribute('aria-pressed', String(choice.id === voice));
    button.onclick = () => { voice = choice.id; for (const other of $('voices').children) other.setAttribute('aria-pressed', String(other === button)); };
    $('voices').append(button);
  }
}
const states = { listening: '듣는 중', thinking: '생각하는 중', speaking: '말하는 중', initializing: '연결하는 중', idle: '대기' };

const companions = await (await fetch('/companions')).json();
for (const item of companions) {
  const button = document.createElement('button');
  button.textContent = item.title; button.disabled = !item.ready; button.title = item.reason ?? '';
  button.onclick = () => { chosen = item; for (const other of $('who').children) other.setAttribute('aria-pressed', String(other === button)); $('state').textContent = `${item.title}에게 걸기`; $('why').textContent = ''; showVoices(item); };
  $('who').append(button);
  if (!item.ready) $('why').textContent += `${item.title}: ${item.reason}\n`;
}

const lines = new Map();
// Directions such as [laughing] or <whisper>…</whisper> shape the voice; they are not words to read.
const shown = text => text.replace(/\[[^\]]{1,80}\]\s*/g, '').replace(/<\/?[a-z]{2,12}>/g, '').trim();
function say(id, who, text) {
  let line = lines.get(id);
  if (!line) { line = document.createElement('div'); line.className = `bubble ${who}`; $('log').append(line); lines.set(id, line); }
  line.textContent = shown(text); $('log').scrollTop = $('log').scrollHeight;
}

const post = (route, body) => fetch(route, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
let callId = null, ringing = null, ringer = null;

/** Joins a call's room with the token the service handed out. */
async function connect({ url, token, call }, title) {
  callId = call.id;
  room = new Room({ audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  room.on(RoomEvent.TrackSubscribed, track => { if (track.kind === Track.Kind.Audio) document.body.append(track.attach()); });
  const showState = participant => {
    const state = participant.attributes['lk.agent.state']; if (state) $('state').textContent = states[state] ?? state;
  };
  room.on(RoomEvent.ParticipantAttributesChanged, (_changed, participant) => showState(participant));
  room.on(RoomEvent.ParticipantConnected, showState);
  // Each stream carries one segment's text so far; a later stream for the same segment replaces it.
  room.registerTextStreamHandler('lk.transcription', async (reader, participant) => {
    const who = participant.identity === room.localParticipant.identity ? 'me' : 'them';
    const segment = reader.info.attributes?.['lk.segment_id'] ?? reader.info.id;
    let text = '';
    for await (const chunk of reader) { text += chunk; say(segment, who, text); }
  });
  room.on(RoomEvent.Disconnected, () => {
    if (callId) void post('/hangup', { callId });
    room = null; callId = null; $('call').classList.remove('live'); $('state').textContent = '통화 끝';
  });
  $('state').textContent = '연결하는 중';
  await room.connect(url, token);
  $('state').textContent = `${title} 기다리는 중`;
  for (const participant of room.remoteParticipants.values()) showState(participant);
  await room.localParticipant.setMicrophoneEnabled(true);
  $('call').classList.add('live');
}

$('call').onclick = async () => {
  if (room) { await room.disconnect(); return; }
  if (!chosen) return;
  const answer = await post('/dial', { companion: chosen.id, voice });
  if (!answer.ok) { $('why').textContent = (await answer.json()).error; return; }
  await connect(await answer.json(), chosen.title);
};

// A companion calling: ring until it is answered here, answered elsewhere, declined or missed.
function ring(on) {
  if (on && !ringer) {
    const audio = new AudioContext(); const gain = audio.createGain(); gain.connect(audio.destination); gain.gain.value = 0;
    const tone = audio.createOscillator(); tone.frequency.value = 480; tone.connect(gain); tone.start();
    let at = 0; const beat = setInterval(() => { gain.gain.value = (at++ % 6) < 2 ? 0.15 : 0; }, 333);
    ringer = { stop() { clearInterval(beat); tone.stop(); audio.close(); } };
  }
  if (!on && ringer) { ringer.stop(); ringer = null; }
}
async function watchRings() {
  try {
    const live = await (await fetch('/live')).json();
    const call = live.find(item => item.status === 'ringing');
    if (call && !room) {
      const who = companions.find(item => item.id === call.companion)?.title ?? call.companion;
      ringing = call; $('ring').hidden = false; $('ringWho').textContent = `${who}가 전화해요`; ring(true);
    } else if (!call || room) { ringing = null; $('ring').hidden = true; ring(false); }
  } catch {}
  setTimeout(watchRings, 1500);
}
$('accept').onclick = async () => {
  if (!ringing) return;
  const call = ringing; ringing = null; $('ring').hidden = true; ring(false);
  const answer = await post('/answer', { callId: call.id });
  if (!answer.ok) { $('why').textContent = (await answer.json()).error; return; }
  await connect(await answer.json(), companions.find(item => item.id === call.companion)?.title ?? call.companion);
};
$('decline').onclick = async () => {
  if (!ringing) return;
  const call = ringing; ringing = null; $('ring').hidden = true; ring(false);
  await post('/decline', { callId: call.id });
};
watchRings();
</script>
</body>
</html>
